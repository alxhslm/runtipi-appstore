name: Build and Push LM Studio Image

on:
  push:
    branches:
      - main
    paths:
      - 'apps/lm-studio/Dockerfile'
      - 'apps/lm-studio/entrypoint.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/lm-studio
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lms-headless:latest
